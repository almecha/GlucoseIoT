version: "3.9"

services:
  catalog:
    build: ./catalog_branch
    ports:
      - "9080:9080"
    volumes:
      - ./catalog_branch/CATALOG.json:/app/CATALOG.json
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - glucose_network
    environment:
      - TZ=Europe/Rome
    restart: unless-stopped

  doctor_bot:
    build: "./Doctor's TelegramBot"
    depends_on:
      - catalog
      - dashboard
    networks:
      - glucose_network
    environment:
      - INIT_DELAY=5
      - TZ=Europe/Rome
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    restart: unless-stopped

  patients_bot:
    build: "./Patient's TelegramBot"
    depends_on:
      - catalog
      - mqtt-broker
    networks:
      - glucose_network
    environment:
      - INIT_DELAY=10
      - CATALOG_URL=http://catalog:9080
      - TZ=Europe/Rome
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    restart: always
    stdin_open: true 
    tty: true

  # MQTT Local Broker 
  mqtt-broker:
    image: eclipse-mosquitto:2.0
    depends_on:
      - catalog
    ports:
      - "1883:1883"
    networks:
      - glucose_network
    environment:
      - TZ=Europe/Rome
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    restart: unless-stopped

  # Dashboard
  dashboard:
    build: ./dashboard
    depends_on:
      - catalog
      - reports-generator
    ports:
      - "8501:8501"  # Streamlit port
    networks:
      - glucose_network
    environment:
      - CATALOG_URL=http://catalog:9080
      - TZ=Europe/Rome
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    restart: unless-stopped

  # Threshold Analyzer
  threshold-analyzer:
    build: ./threshold_analyser
    depends_on:
      - catalog
      - mqtt-broker
    networks:
      - glucose_network
    environment:
      - CATALOG_URL=http://catalog:9080
      - TZ=Europe/Rome
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    restart: unless-stopped

  # Reports Generator
  reports-generator:
    build: ./reports_generator
    depends_on:
      - catalog
    networks:
      - glucose_network
    environment:
      - CATALOG_URL=http://catalog:9080
      - TZ=Europe/Rome
    ports:
      - "9083:9083"  # API port for reports
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    restart: unless-stopped

  # Thingspeak Adaptor
  thingspeak-adaptor:
    build: ./thingspeak_adaptor
    depends_on:
      - catalog
      - mqtt-broker
    networks:
      - glucose_network
    environment:
      - BROKER_IP=mqtt-broker
      - BROKER_PORT=1883
      - CATALOG_URL=http://catalog:9080
      - THINGSPEAK_API_KEY=your_thingspeak_api_key
      - THINGSPEAK_CHANNEL_ID=your_channel_id
      - TZ=Europe/Rome
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    restart: unless-stopped

  # Raspberry Pi Device Connector (Simulator)
  device-connector:
    build: ./device_connector
    depends_on:
      catalog:
        condition: service_started
      thingspeak-adaptor:
        condition: service_started
    networks:
      - glucose_network
    environment:
      - CATALOG_URL=http://catalog:9080
      - MQTT_BROKER=mqtt-broker
      - MQTT_PORT=1883
      - SIMULATION_MODE=true
      - TZ=Europe/Rome
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    restart: unless-stopped

networks:
  glucose_network:
    driver: bridge


# Initiate all services
#docker-compose up -d

# initiate specific services
#docker-compose up -d mqtt-broker catalog doctor_bot patients_bot

# see logs
#docker-compose logs -f

# stop
#docker-compose down

#endpoints:
# Catalog: http://localhost:9080

# Dashboard: http://localhost:3000

# Reports API: http://localhost:9081

# MQTT Broker: localhost:1883
